<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-label="Live marshal gantry — 40 sweeps per minute">
  <title>Marshal gantry — 40 sweeps per minute</title>

  <!--
    ┌─────────────────────────────────────────────────────────────┐
    │  APEX · MARSHAL — the strip between boards 01 and 02         │
    │                                                             │
    │  A marshal light gantry: 27 posts in one unbroken ramp, with │
    │  its three sectors of nine marked underneath rather than cut  │
    │  into the run — the only rhythm in the strip is the ramp.    │
    │  Only lit posts are drawn — there is no off state to look    │
    │  at, the way a real panel is dark until it has something to  │
    │  say.                                                        │
    │                                                             │
    │  The gantry ramps: posts grow from a 4px sliver at the left  │
    │  to the full 22px at the right while the gaps between them   │
    │  close. Firing stays evenly spaced in time, so as the posts  │
    │  fatten and crowd the head visibly slows — it brakes into    │
    │  the corner rather than running the strip at one speed.      │
    │                                                             │
    │  A sweep runs the posts left to right in 1.20s. Exactly one  │
    │  post is at full brightness — the one the sweep is standing  │
    │  on — and it drops to 42% within a single post of being      │
    │  passed, so the tail reads as four or five posts and what    │
    │  is left of it dies out quietly over the second behind that. │
    │  Post i fires at 1.20s × i / 27 — one shared clock, nothing  │
    │  on a private timer.                                         │
    │                                                             │
    │  Sweeps start 1.50s apart, which is the 40 SWEEP/MIN the     │
    │  label claims: the number is the rate, not a caption. The    │
    │  0.30s between one sweep finishing and the next launching    │
    │  is the hold, and the gantry glows down through it rather    │
    │  than going out.                                             │
    │                                                             │
    │  One accent, as the contract asks: green, and nothing else.  │
    │  Green is the sector colour of a timing screen and the flag  │
    │  for a clear track, so the gantry means the same thing at    │
    │  rest as it does running.                                    │
    └─────────────────────────────────────────────────────────────┘
  -->

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }

    /* ── one clock: a sweep every 1.50s = 40 sweeps per minute ── */
    /* one post at full, then a fast drop: the shape of the falloff is in the
       keyframes, not the easing, so the tail is four or five posts long and
       what is left of it dies out quietly rather than being cut off */
    .lamp { fill: #2ee08a; opacity: 0; animation: fire 1.5s linear infinite }
    @keyframes fire {
      0%   { opacity: 1 }
      4%   { opacity: .42 }
      12%  { opacity: .20 }
      29%  { opacity: .07 }
      73%  { opacity: 0 }
      100% { opacity: 0 }
    }

    /* glow belongs to the node: only the post the sweep is standing on */
    .halo { opacity: 0; animation: bloom 1.5s cubic-bezier(.2,.7,.35,1) infinite }
    @keyframes bloom { 0% { opacity: .6 } 13% { opacity: 0 } 100% { opacity: 0 } }

    .p0 { animation-delay: 0.0000s }
    .p1 { animation-delay: 0.0444s }
    .p2 { animation-delay: 0.0889s }
    .p3 { animation-delay: 0.1333s }
    .p4 { animation-delay: 0.1778s }
    .p5 { animation-delay: 0.2222s }
    .p6 { animation-delay: 0.2667s }
    .p7 { animation-delay: 0.3111s }
    .p8 { animation-delay: 0.3556s }
    .p9 { animation-delay: 0.4000s }
    .p10 { animation-delay: 0.4444s }
    .p11 { animation-delay: 0.4889s }
    .p12 { animation-delay: 0.5333s }
    .p13 { animation-delay: 0.5778s }
    .p14 { animation-delay: 0.6222s }
    .p15 { animation-delay: 0.6667s }
    .p16 { animation-delay: 0.7111s }
    .p17 { animation-delay: 0.7556s }
    .p18 { animation-delay: 0.8000s }
    .p19 { animation-delay: 0.8444s }
    .p20 { animation-delay: 0.8889s }
    .p21 { animation-delay: 0.9333s }
    .p22 { animation-delay: 0.9778s }
    .p23 { animation-delay: 1.0222s }
    .p24 { animation-delay: 1.0667s }
    .p25 { animation-delay: 1.1111s }
    .p26 { animation-delay: 1.1556s }

    .beacon { animation: beacon 2.5s steps(1) infinite }
    @keyframes beacon { 0%,44% { opacity: 1 } 44.01%,100% { opacity: .22 } }

    @media (prefers-reduced-motion: reduce) {
      /* no sweep to run: every post rests evenly lit — track clear */
      .lamp { animation: none; opacity: .8 }
      .halo { display: none }
      .beacon { animation: none }
    }
  </style>

  <defs>
    <pattern id="pHatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)">
      <rect x="0" y="0" width="2.2" height="16" fill="#14181c"/>
    </pattern>
    <linearGradient id="pFade" x1="4%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="62%" stop-color="#fff" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="pMask"><rect width="1200" height="110" fill="url(#pFade)"/></mask>
    <clipPath id="pFrame"><rect x="0" y="0" width="1200" height="110" rx="3"/></clipPath>
      <radialGradient id="pGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2ee08a" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#2ee08a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="110" rx="3" fill="#0a0c0e"/>
  <g clip-path="url(#pFrame)">
    <rect width="1200" height="110" fill="url(#pHatch)" mask="url(#pMask)"/>
    <rect x="0" y="104" width="24" height="5" fill="#2ee08a" opacity=".55"/><rect x="24" y="104" width="24" height="5" fill="#0e1216"/><rect x="48" y="104" width="24" height="5" fill="#1a2026"/><rect x="72" y="104" width="24" height="5" fill="#0e1216"/><rect x="96" y="104" width="24" height="5" fill="#1a2026"/><rect x="120" y="104" width="24" height="5" fill="#0e1216"/><rect x="144" y="104" width="24" height="5" fill="#1a2026"/><rect x="168" y="104" width="24" height="5" fill="#0e1216"/><rect x="192" y="104" width="24" height="5" fill="#1a2026"/><rect x="216" y="104" width="24" height="5" fill="#0e1216"/><rect x="240" y="104" width="24" height="5" fill="#1a2026"/><rect x="264" y="104" width="24" height="5" fill="#0e1216"/><rect x="288" y="104" width="24" height="5" fill="#1a2026"/><rect x="312" y="104" width="24" height="5" fill="#0e1216"/><rect x="336" y="104" width="24" height="5" fill="#1a2026"/><rect x="360" y="104" width="24" height="5" fill="#0e1216"/><rect x="384" y="104" width="24" height="5" fill="#1a2026"/><rect x="408" y="104" width="24" height="5" fill="#0e1216"/><rect x="432" y="104" width="24" height="5" fill="#1a2026"/><rect x="456" y="104" width="24" height="5" fill="#0e1216"/><rect x="480" y="104" width="24" height="5" fill="#1a2026"/><rect x="504" y="104" width="24" height="5" fill="#0e1216"/><rect x="528" y="104" width="24" height="5" fill="#1a2026"/><rect x="552" y="104" width="24" height="5" fill="#0e1216"/><rect x="576" y="104" width="24" height="5" fill="#1a2026"/><rect x="600" y="104" width="24" height="5" fill="#0e1216"/><rect x="624" y="104" width="24" height="5" fill="#1a2026"/><rect x="648" y="104" width="24" height="5" fill="#0e1216"/><rect x="672" y="104" width="24" height="5" fill="#1a2026"/><rect x="696" y="104" width="24" height="5" fill="#0e1216"/><rect x="720" y="104" width="24" height="5" fill="#1a2026"/><rect x="744" y="104" width="24" height="5" fill="#0e1216"/><rect x="768" y="104" width="24" height="5" fill="#1a2026"/><rect x="792" y="104" width="24" height="5" fill="#0e1216"/><rect x="816" y="104" width="24" height="5" fill="#1a2026"/><rect x="840" y="104" width="24" height="5" fill="#0e1216"/><rect x="864" y="104" width="24" height="5" fill="#1a2026"/><rect x="888" y="104" width="24" height="5" fill="#0e1216"/><rect x="912" y="104" width="24" height="5" fill="#1a2026"/><rect x="936" y="104" width="24" height="5" fill="#0e1216"/><rect x="960" y="104" width="24" height="5" fill="#1a2026"/><rect x="984" y="104" width="24" height="5" fill="#0e1216"/><rect x="1008" y="104" width="24" height="5" fill="#1a2026"/><rect x="1032" y="104" width="24" height="5" fill="#0e1216"/><rect x="1056" y="104" width="24" height="5" fill="#1a2026"/><rect x="1080" y="104" width="24" height="5" fill="#0e1216"/><rect x="1104" y="104" width="24" height="5" fill="#1a2026"/><rect x="1128" y="104" width="24" height="5" fill="#0e1216"/><rect x="1152" y="104" width="24" height="5" fill="#1a2026"/><rect x="1176" y="104" width="24" height="5" fill="#0e1216"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="109" rx="3" fill="none" stroke="#232a30"/>

  <!-- ══ DIRECTION CHEVRONS ═══════════════════════════════ -->
  <path d="M100 1l7 5l-7 5M200 1l7 5l-7 5M300 1l7 5l-7 5M400 1l7 5l-7 5M500 1l7 5l-7 5M600 1l7 5l-7 5M700 1l7 5l-7 5M800 1l7 5l-7 5M900 1l7 5l-7 5M1000 1l7 5l-7 5M1100 1l7 5l-7 5" fill="none" stroke="#232a30" stroke-width="1" opacity=".9"/>

  <!-- ══ LABELS ═══════════════════════════════════════════ -->
  <path class="beacon" d="M35 51h9l-3 10h-9Z" fill="#2ee08a"/>
  <text x="52" y="60" class="mono" font-size="9.5" letter-spacing="3.4" fill="#2ee08a">MARSHAL</text>
  <text x="1168" y="60" class="mono" font-size="9.5" letter-spacing="3.4" fill="#7e8a90"
        text-anchor="end" opacity=".85">40 SWEEP / MIN</text>

  <!-- ══ GANTRY — 27 posts, 3 sectors of 9, lit only ══════ -->
  <g><ellipse class="halo p0" cx="136.7" cy="53" rx="15.6" ry="23" fill="url(#pGlow)"/><ellipse class="halo p1" cx="176.4" cy="53" rx="16.1" ry="23" fill="url(#pGlow)"/><ellipse class="halo p2" cx="215.7" cy="53" rx="16.5" ry="23" fill="url(#pGlow)"/><ellipse class="halo p3" cx="254.5" cy="53" rx="16.9" ry="23" fill="url(#pGlow)"/><ellipse class="halo p4" cx="292.8" cy="53" rx="17.4" ry="23" fill="url(#pGlow)"/><ellipse class="halo p5" cx="330.6" cy="53" rx="17.9" ry="23" fill="url(#pGlow)"/><ellipse class="halo p6" cx="368.0" cy="53" rx="18.3" ry="23" fill="url(#pGlow)"/><ellipse class="halo p7" cx="404.9" cy="53" rx="18.8" ry="23" fill="url(#pGlow)"/><ellipse class="halo p8" cx="441.3" cy="53" rx="19.2" ry="23" fill="url(#pGlow)"/><ellipse class="halo p9" cx="477.3" cy="53" rx="19.6" ry="23" fill="url(#pGlow)"/><ellipse class="halo p10" cx="512.8" cy="53" rx="20.1" ry="23" fill="url(#pGlow)"/><ellipse class="halo p11" cx="547.8" cy="53" rx="20.6" ry="23" fill="url(#pGlow)"/><ellipse class="halo p12" cx="582.3" cy="53" rx="21.0" ry="23" fill="url(#pGlow)"/><ellipse class="halo p13" cx="616.4" cy="53" rx="21.5" ry="23" fill="url(#pGlow)"/><ellipse class="halo p14" cx="650.0" cy="53" rx="21.9" ry="23" fill="url(#pGlow)"/><ellipse class="halo p15" cx="683.1" cy="53" rx="22.4" ry="23" fill="url(#pGlow)"/><ellipse class="halo p16" cx="715.8" cy="53" rx="22.8" ry="23" fill="url(#pGlow)"/><ellipse class="halo p17" cx="747.9" cy="53" rx="23.2" ry="23" fill="url(#pGlow)"/><ellipse class="halo p18" cx="779.7" cy="53" rx="23.7" ry="23" fill="url(#pGlow)"/><ellipse class="halo p19" cx="810.9" cy="53" rx="24.1" ry="23" fill="url(#pGlow)"/><ellipse class="halo p20" cx="841.7" cy="53" rx="24.6" ry="23" fill="url(#pGlow)"/><ellipse class="halo p21" cx="871.9" cy="53" rx="25.1" ry="23" fill="url(#pGlow)"/><ellipse class="halo p22" cx="901.8" cy="53" rx="25.5" ry="23" fill="url(#pGlow)"/><ellipse class="halo p23" cx="931.1" cy="53" rx="26.0" ry="23" fill="url(#pGlow)"/><ellipse class="halo p24" cx="960.0" cy="53" rx="26.4" ry="23" fill="url(#pGlow)"/><ellipse class="halo p25" cx="988.4" cy="53" rx="26.9" ry="23" fill="url(#pGlow)"/><ellipse class="halo p26" cx="1016.3" cy="53" rx="27.3" ry="23" fill="url(#pGlow)"/></g>
  <g><path class="lamp p0" d="M137.3 34.0h4.0l-5.3 38.0H132.0Z"/><path class="lamp p1" d="M176.7 34.0h4.7l-5.3 38.0H171.4Z"/><path class="lamp p2" d="M215.6 34.0h5.4l-5.3 38.0H210.3Z"/><path class="lamp p3" d="M254.1 34.0h6.1l-5.3 38.0H248.7Z"/><path class="lamp p4" d="M292.1 34.0h6.8l-5.3 38.0H286.7Z"/><path class="lamp p5" d="M329.6 34.0h7.5l-5.3 38.0H324.2Z"/><path class="lamp p6" d="M366.6 34.0h8.2l-5.3 38.0H361.2Z"/><path class="lamp p7" d="M403.1 34.0h8.8l-5.3 38.0H397.8Z"/><path class="lamp p8" d="M439.2 34.0h9.5l-5.3 38.0H433.9Z"/><path class="lamp p9" d="M474.8 34.0h10.2l-5.3 38.0H469.5Z"/><path class="lamp p10" d="M510.0 34.0h10.9l-5.3 38.0H504.6Z"/><path class="lamp p11" d="M544.6 34.0h11.6l-5.3 38.0H539.3Z"/><path class="lamp p12" d="M578.8 34.0h12.3l-5.3 38.0H573.5Z"/><path class="lamp p13" d="M612.6 34.0h13.0l-5.3 38.0H607.2Z"/><path class="lamp p14" d="M645.8 34.0h13.7l-5.3 38.0H640.5Z"/><path class="lamp p15" d="M678.6 34.0h14.4l-5.3 38.0H673.2Z"/><path class="lamp p16" d="M710.9 34.0h15.1l-5.3 38.0H705.6Z"/><path class="lamp p17" d="M742.7 34.0h15.8l-5.3 38.0H737.4Z"/><path class="lamp p18" d="M774.1 34.0h16.5l-5.3 38.0H768.8Z"/><path class="lamp p19" d="M805.0 34.0h17.2l-5.3 38.0H799.6Z"/><path class="lamp p20" d="M835.4 34.0h17.8l-5.3 38.0H830.1Z"/><path class="lamp p21" d="M865.3 34.0h18.5l-5.3 38.0H860.0Z"/><path class="lamp p22" d="M894.8 34.0h19.2l-5.3 38.0H889.5Z"/><path class="lamp p23" d="M923.8 34.0h19.9l-5.3 38.0H918.5Z"/><path class="lamp p24" d="M952.4 34.0h20.6l-5.3 38.0H947.0Z"/><path class="lamp p25" d="M980.4 34.0h21.3l-5.3 38.0H975.1Z"/><path class="lamp p26" d="M1008.0 34.0h22.0l-5.3 38.0H1002.7Z"/></g>

  <!-- ══ SECTOR MARKS ═════════════════════════════════════ -->
  <g class="mono" font-size="8.5" letter-spacing="2.6" fill="#7e8a90" opacity=".7"><text x="290.4" y="92" text-anchor="middle">S1</text><text x="614.0" y="92" text-anchor="middle">S2</text><text x="899.4" y="92" text-anchor="middle">S3</text></g>
</svg>
