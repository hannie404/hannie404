<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Annie Neshreen — Software Engineer, Philippines">
  <title>Annie Neshreen — Software Engineer</title>

  <!--
    ┌─────────────────────────────────────────────────────────────┐
    │  APEX · BOARD 01 — IDENTITY                                 │
    │                                                             │
    │  Trackside board language: asphalt ground under a 24°       │
    │  speed hatch, a rumble-strip kerb along the bottom edge,     │
    │  direction chevrons along the top, and every tab, divider    │
    │  and display word leaning 8° into the direction of travel.  │
    │                                                             │
    │  PALETTE  asphalt #0a0c0e · ink #f2f5f7 · dim #7e8a90       │
    │           accent #2ee08a (green sector) · rail #232a30           │
    │  Bump "2026.08" in the timing strip on revision.            │
    └─────────────────────────────────────────────────────────────┘
  -->

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .disp { font-family: "Helvetica Neue", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-weight: 800; }

    .rise { animation: rise 1s cubic-bezier(.2,.75,.2,1) both }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    .launch { animation: launch 1.15s cubic-bezier(.14,.85,.2,1) both }
    @keyframes launch { from { opacity: 0; transform: translateX(-34px) } to { opacity: 1; transform: none } }
    .d1 { animation-delay: .05s } .d2 { animation-delay: .30s } .d3 { animation-delay: .50s }
    .d4 { animation-delay: .70s } .d5 { animation-delay: .90s } .d6 { animation-delay: 1.1s }

    /*  FLIP BOARD — five titles on one line, 22s cycle
     *
     *  Six rows, 30px apart, inside a 30px window: the strip steps down one
     *  row per title, and row 6 repeats row 1 so the wrap back to 0 lands on
     *  identical copy and never pops. The eased timing function applies per
     *  segment, so each 0.4s flip is eased and each hold sits flat.
     *
     *    ROW  TITLE                   HOLD
     *     1   SOFTWARE ENGINEER       6.0s   ← anchor, holds longest
     *     2   FULL-STACK DEVELOPER    4.0s
     *     3   AI ENGINEER             4.0s
     *     4   FINANCIAL CONSULTANT    4.0s
     *     5   UI/UX DESIGNER          4.0s
     *     6   (SOFTWARE ENGINEER)     wrap
     *
     *  Adding a title means a sixth hold, a new row, and re-deriving the
     *  percentages — 1s = 4.5454% of the cycle. Reduced motion drops the
     *  animation, which parks the strip on row 1: the anchor, alone.
     */
    .flip { animation: flip 22s cubic-bezier(.6,0,.15,1) infinite }
    @keyframes flip {
      0%,25.45%   { transform: translateY(0) }
      27.27%,43.64% { transform: translateY(-30px) }
      45.45%,61.82% { transform: translateY(-60px) }
      63.64%,80%    { transform: translateY(-90px) }
      81.82%,98.18% { transform: translateY(-120px) }
      100%          { transform: translateY(-150px) }
    }

    /* the car: one lap of FIG. A in 6s. The lit window and the head are cut
       from the same path and the same arc length, so they cannot drift. */
    /* dasharray sums to exactly one lap, so the window that walks off the
       start/finish line walks straight back on — no gap, no pop */
    .car  { stroke-dasharray: 150 1179.6; animation: lap 6s linear infinite }
    @keyframes lap { from { stroke-dashoffset: 150 } to { stroke-dashoffset: -1179.6 } }
    .head { transform: translate(779.36px, 279.40px); animation: ride 6s linear infinite }
    @keyframes ride {
      0%{transform:translate(779.36px,279.40px)} 2.273%{transform:translate(809.47px,281.70px)} 4.545%{transform:translate(839.68px,282.40px)}
      6.818%{transform:translate(869.89px,282.90px)} 9.091%{transform:translate(900.10px,283.63px)} 11.36%{transform:translate(930.32px,284.22px)}
      13.64%{transform:translate(960.53px,284.68px)} 15.91%{transform:translate(990.75px,285.02px)} 18.18%{transform:translate(1020.96px,285.52px)}
      20.45%{transform:translate(1051.18px,285.69px)} 22.73%{transform:translate(1081.35px,284.24px)} 25%{transform:translate(1111.34px,280.61px)}
      27.27%{transform:translate(1138.23px,268.38px)} 29.55%{transform:translate(1128.06px,247.16px)} 31.82%{transform:translate(1098.35px,241.84px)}
      34.09%{transform:translate(1068.14px,241.92px)} 36.36%{transform:translate(1038.10px,239.78px)} 38.64%{transform:translate(1010.11px,228.67px)}
      40.91%{transform:translate(1014.75px,208.06px)} 43.18%{transform:translate(1042.78px,196.94px)} 45.45%{transform:translate(1072.77px,193.54px)}
      47.73%{transform:translate(1102.71px,189.89px)} 50%{transform:translate(1129.77px,176.91px)} 52.27%{transform:translate(1110.68px,163.38px)}
      54.55%{transform:translate(1103.62px,149.90px)} 56.82%{transform:translate(1122.10px,133.95px)} 59.09%{transform:translate(1094.32px,122.74px)}
      61.36%{transform:translate(1064.35px,119.09px)} 63.64%{transform:translate(1034.16px,117.91px)} 65.91%{transform:translate(1003.94px,117.59px)}
      68.18%{transform:translate(973.73px,117.83px)} 70.45%{transform:translate(943.53px,118.92px)} 72.73%{transform:translate(913.36px,120.59px)}
      75%{transform:translate(883.20px,122.46px)} 77.27%{transform:translate(853.05px,124.56px)} 79.55%{transform:translate(823.26px,129.33px)}
      81.82%{transform:translate(796.82px,143.19px)} 84.09%{transform:translate(814.99px,160.44px)} 86.36%{transform:translate(828.40px,178.06px)}
      88.64%{transform:translate(803.29px,194.64px)} 90.91%{transform:translate(825.73px,210.06px)} 93.18%{transform:translate(835.56px,229.92px)}
      95.45%{transform:translate(811.75px,248.45px)} 97.73%{transform:translate(784.53px,261.31px)} 100%{transform:translate(779.36px,279.40px)}
    }

    .beacon { animation: beacon 2.2s steps(1) infinite }
    @keyframes beacon { 0%,46% { opacity: 1 } 46.01%,100% { opacity: .22 } }

    @media (prefers-reduced-motion: reduce) {
      .rise, .launch { animation: none; opacity: 1; transform: none }
      /* cycle stops on the anchor — row 1, alone in the window */
      .flip { animation: none }
      /* no lap to run: the racing line stands in, lit */
      .car, .head { display: none }
      .line { opacity: .45 }
      .beacon { animation: none }
    }
  </style>

